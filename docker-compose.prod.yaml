services:
  migrations:
    build:
      context: .
      target: migrate-run
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
    networks:
      - web
  api:
    build:
      context: .
      target: prod
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=${API_PORT:-3001}
      - HOST=${HOST:-0.0.0.0}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - UI_URL=${UI_URL}
      - API_URL=${API_URL}
      - REDIS_URL=${REDIS_URL}
      - CACHE_TTL=${CACHE_TTL:-60000}
      - BRANDFETCH_API_CLIENT=${BRANDFETCH_API_CLIENT}
      - UI_URL_RESET_PASSWORD_REDIRECT=${UI_URL_RESET_PASSWORD_REDIRECT}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_VERIFY_TRANSPORTERS=${MAIL_VERIFY_TRANSPORTERS:-false}
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookmark-manager-api.rule=Host(`api.bookmark-manager.local`)"
      - "traefik.http.routers.bookmark-manager-api.entrypoints=websecure"
      - "traefik.http.routers.bookmark-manager-api.tls=true"
      - "traefik.http.services.bookmark-manager-api.loadbalancer.server.port=${API_PORT:-3001}"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('node:http');const bindHost=process.env.HOST||'0.0.0.0';const host=bindHost==='0.0.0.0'?'127.0.0.1':bindHost==='::'?'::1':bindHost;const port=Number(process.env.PORT||3001);const req=http.get({host,port,path:'/api/health'},(res)=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.setTimeout(4000,()=>{req.destroy();process.exit(1)});",
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: unless-stopped

  web:
    build:
      context: .
      target: prod
      dockerfile: apps/web/Dockerfile
      args:
        - API_PROTOCOL=${API_PROTOCOL:-http}
        - API_HOST=${API_HOST:-api}
        - API_PORT=${API_PORT:-3001}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://${API_HOST:-api}:${API_PORT:-3001}}
        - NEXT_PUBLIC_UI_URL=${NEXT_PUBLIC_UI_URL:-http://localhost:3000}
    environment:
      - NODE_ENV=production
      - PORT=${PORT_WEB:-3000}
      - HOSTNAME=0.0.0.0
      - API_PROTOCOL=${API_PROTOCOL:-http}
      - API_HOST=${API_HOST:-api}
      - API_PORT=${API_PORT:-3001}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://${API_HOST:-api}:${API_PORT:-3001}}
      - NEXT_PUBLIC_UI_URL=${NEXT_PUBLIC_UI_URL:-http://localhost:3000}
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookmark-manager-web.rule=Host(`web.bookmark-manager.local`)"
      - "traefik.http.routers.bookmark-manager-web.entrypoints=websecure"
      - "traefik.http.routers.bookmark-manager-web.tls=true"
      - "traefik.http.services.bookmark-manager-web.loadbalancer.server.port=${PORT_WEB:-3000}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('node:http');const bindHost=process.env.HOSTNAME||process.env.HOST||'0.0.0.0';const host=bindHost==='0.0.0.0'?'127.0.0.1':bindHost==='::'?'::1':bindHost;const port=Number(process.env.PORT||3000);const req=http.get({host,port,path:'/api/health'},(res)=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.setTimeout(4000,()=>{req.destroy();process.exit(1)});",
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: unless-stopped

networks:
  web:
   external: true
