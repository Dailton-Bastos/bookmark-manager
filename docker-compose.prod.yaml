services:
  api:
    build:
      context: .
      target: prod
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3001}
      - HOST=${HOST:-0.0.0.0}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - UI_URL=${UI_URL}
      - API_URL=${API_URL}
      - REDIS_URL=${REDIS_URL}
      - CACHE_TTL=${CACHE_TTL:-60000}
      - BRANDFETCH_API_CLIENT=${BRANDFETCH_API_CLIENT}
      - UI_URL_RESET_PASSWORD_REDIRECT=${UI_URL_RESET_PASSWORD_REDIRECT}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_VERIFY_TRANSPORTERS=${MAIL_VERIFY_TRANSPORTERS:-false}
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookmark-manager-api.rule=Host(`api.bookmark-manager.local`)"
      - "traefik.http.routers.bookmark-manager-api.entrypoints=websecure"
      - "traefik.http.routers.bookmark-manager-api.tls=true"
      - "traefik.http.services.bookmark-manager-api.loadbalancer.server.port=${PORT:-3001}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('node:http');const req=http.get('http://${HOST:-0.0.0.0}:${PORT:-3001}/api/health',(res)=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.setTimeout(4000,()=>{req.destroy();process.exit(1)});",
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: unless-stopped

networks:
  web:
   external: true
